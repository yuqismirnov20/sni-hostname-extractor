[project]
name = "sni-hostname-extractor"
version = "0.1.0"
description = "Parse the TLS ClientHello byte stream from a captured TCP segment and extract the Server Name extension value."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
